ignoreUntil = 2027-02-17
reason = "picomatch ReDoS on single-branch repeated extglobs (published 19 Oct 2026). No fixed release on any line on 17 Nov 2026: the advisory covers <= 4.0.7, and 2.3.2 and 4.0.7 are the newest 2.x and 4.x. Every copy is build, test or CI tooling (fast-glob via @next/eslint-plugin-next; vite, vitest, @rollup/pluginutils via Storybook, @rolldown/plugin-babel; @sanity/cli; tinyglobby via lockfile-lint), matching glob patterns from this repo's own config. Nothing in app/, lib/ or components/ imports a glob matcher, so no outside input reaches it. When a fixed picomatch ships, bump it (an override if a parent pins the range) and delete this entry."
