name: Runner smoke test

# Temporary (private-repo plan, 23 Nov 2026): proves an AWS spot runner from
# ops/ci-runners starts, runs one job with what CI needs, and terminates.
# Runs only on pushes to this branch; the branch is deleted after the test.

on:
  push:
    branches: [test/stellr-ci-runner-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, stellr-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Machine
        run: |
          uname -a; nproc; free -g; df -h /
          curl -s -H "X-aws-ec2-metadata-token: $(curl -sX PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')" http://169.254.169.254/latest/meta-data/instance-life-cycle; echo
      - name: Tools CI uses
        run: |
          git --version; gh --version | head -1; jq --version; shellcheck --version | head -2; aws --version; node --version
          docker run --rm hello-world | head -3
      - run: npm ci
      - name: Unit tests (a slice)
        run: npx vitest run lib/utils.test.ts lib/csv.test.ts
